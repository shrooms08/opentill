# fly.live.toml — opentill-live: REAL Tachi settlement on tachi-regtest-1.
# Secrets (OPENTILL_API_KEY, OPENTILL_WEBHOOK_SECRET, TACHI_MNEMONIC) live in `fly secrets`, never here.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'opentill-live'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADAPTER_MODE = 'tachi'
  TACHI_NETWORK = 'regtest'
  TACHI_RPC_URL = 'https://rpc-regtest.tachibtc.com'
  TACHI_STATE_PATH = '/data/tachi-state.json'   # on the volume: a restart must not orphan the keys
  OPENTILL_DEV_PUBLIC_SIMULATE = 'false'
  HOST = '0.0.0.0'
  OPENTILL_DB_PATH = '/data/opentill.db'
  OPENTILL_MERCHANT_NAME = 'Satoshi Beans (live)'
  PORT = '8080'

[[mounts]]
  source = 'opentill_live_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'   # tachi init talks to the daemon before listen(); 10s tripped one check at boot
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
