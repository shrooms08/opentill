    .tray { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) { .tray { fill: #f5f5f5; } }
  </style>
  <circle cx="12" cy="5.5" r="4" fill="#f7931a"/>
  <path class="tray" fill-rule="evenodd" d="M3 11h3v7h12v-7h3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/>
</svg>
